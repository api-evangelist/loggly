aid: loggly
name: Loggly
description: >-
  Loggly is a cloud-based log management and analytics service (part of SolarWinds)
  that aggregates, searches, and visualizes application, server, and infrastructure
  logs in real time. Developers ship logs over syslog or the HTTP/S event endpoint
  and query them through a REST API supporting full-text search, field faceting,
  statistics, and dashboards. Loggly offers token-based (bearer) API authentication,
  an event-retrieval API (search, events, iterate, fields, stats) and a
  customer-token ingestion API, with SOC 2 Type II, PCI, and HIPAA-aligned security.
  Originally surfaced as a trinity-ventures portfolio lead, this profile has been
  enriched with real, searched API artifacts.
